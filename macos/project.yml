name: TidysetNative
options:
  bundleIdPrefix: com.lukemclaughlin
  deploymentTarget:
    macOS: "14.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "122"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 24UCS53598
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
targets:
  Tidyset:
    type: application
    platform: macOS
    sources:
      - Sources/Engine
      - Sources/App
      - Resources
    entitlements:
      path: Tidyset.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukemclaughlin.tidyset
        PRODUCT_NAME: Tidyset
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tidyset
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Luke McLaughlin"
    scheme:
      testTargets:
        - TidysetEngineTests
  TidysetEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/Engine
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukemclaughlin.tidyset.enginetests
        GENERATE_INFOPLIST_FILE: YES
